<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>תקציב משק הבית 🔒</title>
<style>
  :root{--ground:#EEF3F1;--surface:#fff;--ink:#12211E;--muted:#5E6E69;--line:#E5ECE9;--accent:#0D9488;--red:#B91C1C;
    --shadow:0 1px 2px rgba(20,40,35,.05),0 18px 40px -20px rgba(20,40,35,.35);}
  @media(prefers-color-scheme:dark){:root{--ground:#0A100E;--surface:#16201D;--ink:#E7EEEB;--muted:#93A29C;--line:#25322E;--accent:#2DD4BF;--red:#F87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -20px rgba(0,0,0,.8);}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ground);font-family:"Heebo","Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);direction:rtl}
  #lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px 24px;text-align:center}
  .emoji{font-size:44px}
  h1{font-size:20px;font-weight:800;margin-top:12px}
  p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.55}
  form{margin-top:20px;display:flex;flex-direction:column;gap:11px}
  input{width:100%;background:var(--ground);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;font:inherit;font-size:16px;color:var(--ink);text-align:center;direction:ltr}
  input:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;border-radius:13px;padding:14px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.5}
  .err{color:var(--red);font-size:12.5px;font-weight:700;min-height:16px;margin-top:2px}
  label.rem{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .foot{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5}
</style></head><body>
<div id="lock"><div class="box">
  <div class="emoji">🔒</div>
  <h1>תקציב משק הבית</h1>
  <p>הנתונים מוצפנים בקובץ עצמו. הזן סיסמה כדי לפתוח — הפענוח מתבצע במכשיר שלך בלבד.</p>
  <form id="f">
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="סיסמה" autofocus>
    <div class="err" id="err"></div>
    <label class="rem"><input type="checkbox" id="rem" checked> זכור אותי במכשיר הזה</label>
    <button id="go" type="submit">פתח 🔓</button>
  </form>
  <div class="foot">🔐 הצפנת AES-256 · הסיסמה לא נשמרת בשרת. שכחת? בקש ממני קישור חדש.</div>

const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(BLOB.salt),iterations:BLOB.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(BLOB.iv)},key,dec(BLOB.ct));
  return new TextDecoder().decode(pt);
}
function render(html){document.open("text/html","replace");document.write(html);document.close();}
const f=document.getElementById("f"),pwEl=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go"),rem=document.getElementById("rem");
async function attempt(pw,silent){
  err.textContent="";go.disabled=true;go.textContent="פותח…";
  try{const html=await unlock(pw);
    try{(rem.checked?localStorage:sessionStorage).setItem("bpw",pw);}catch(e){}
    render(html);
  }catch(e){
    go.disabled=false;go.textContent="פתח 🔓";
    if(!silent){err.textContent="סיסמה שגויה — נסה שוב";pwEl.select();}
    try{localStorage.removeItem("bpw");sessionStorage.removeItem("bpw");}catch(_){}
  }
}
f.addEventListener("submit",e=>{e.preventDefault();if(pwEl.value)attempt(pwEl.value,false);});
// ניסיון פתיחה אוטומטי אם נשמר קודם
const saved=(()=>{try{return localStorage.getItem("bpw")||sessionStorage.getItem("bpw");}catch(e){return null;}})();
if(saved)attempt(saved,true);
</script></body></html>
